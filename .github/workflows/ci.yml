name: CI

on:
  push:
    branches: master
  pull_request:
    branches: develop

permissions:
  contents: read

jobs:
  prepare:
    name: Build arcus-memcached
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    environment: ee
    env:
      PREFIX: /home/runner/arcus-memcached
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.EE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EE_APP_KEY }}
          owner: jam2in
          repositories: arcus-memcached-EE

      - name: Resolve revision
        id: rev
        env:
          REPO_URL: https://x-access-token:${{ steps.app.outputs.token }}@github.com/jam2in/arcus-memcached-EE.git
        run: echo "sha=$(git ls-remote "$REPO_URL" refs/heads/memc_repl_dev | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: arcus-memcached-${{ steps.rev.outputs.sha }}

      - name: Fetch source
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REPO_URL: https://x-access-token:${{ steps.app.outputs.token }}@github.com/jam2in/arcus-memcached-EE.git
        run: |
          git init -q src && cd src
          git fetch -q --depth 1 "$REPO_URL" ${{ steps.rev.outputs.sha }}
          git checkout -q FETCH_HEAD

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          ./deps/install.sh "$PREFIX"
          ./config/autorun.sh
          ./configure --prefix="$PREFIX" --enable-zk-integration --enable-replication \
            --with-libevent="$PREFIX" --with-zookeeper="$PREFIX"
          make -j"$(nproc)" install
          cp config.h config_static.h "$PREFIX/"

      - name: Collect headers
        run: |
          mkdir -p headers/include/memcached
          cp "$PREFIX/config.h" "$PREFIX/config_static.h" headers/
          cp "$PREFIX"/include/arcus-memcached/*.h headers/include/memcached/

      - uses: actions/upload-artifact@v4
        with:
          name: memcached-headers
          path: headers/

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memcached-headers
      - run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memcached-headers
      - run: cargo build
      - run: cargo test
