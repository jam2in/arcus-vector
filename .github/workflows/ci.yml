name: CI

on:
  push:
    branches: master
  pull_request:
    branches: develop

permissions:
  contents: read

jobs:
  prepare:
    name: Build arcus-memcached
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    environment: ee
    env:
      PREFIX: /home/runner/arcus-memcached
    outputs:
      cache-key: arcus-memcached-${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.EE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EE_APP_KEY }}
          owner: jam2in
          repositories: arcus-memcached-EE

      - name: Resolve revision
        id: rev
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          sha=$(gh api repos/jam2in/arcus-memcached-EE/commits/memc_repl_dev --jq .sha)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: arcus-memcached-${{ steps.rev.outputs.sha }}

      - name: Fetch source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: jam2in/arcus-memcached-EE
          ref: ${{ steps.rev.outputs.sha }}
          token: ${{ steps.app.outputs.token }}
          path: src
          persist-credentials: false

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          ./deps/install.sh "$PREFIX"
          ./config/autorun.sh
          ./configure --prefix="$PREFIX" --enable-zk-integration --enable-replication \
            --with-libevent="$PREFIX" --with-zookeeper="$PREFIX"
          make -j"$(nproc)" install
          cp config.h config_static.h "$PREFIX/"

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      PREFIX: /home/runner/arcus-memcached
    steps:
      - uses: actions/checkout@v4

      - name: Restore arcus-memcached
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREFIX }}
          key: ${{ needs.prepare.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Copy headers
        run: |
          cp "$PREFIX/config.h" "$PREFIX/config_static.h" .
          mkdir -p include/memcached
          cp "$PREFIX"/include/arcus-memcached/*.h include/memcached/

      - run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      PREFIX: /home/runner/arcus-memcached
    services:
      zookeeper:
        image: zookeeper:3.9.1
        ports:
          - 2181:2181
        options: --health-cmd "zkServer.sh status" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore arcus-memcached
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREFIX }}
          key: ${{ needs.prepare.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Copy headers
        run: |
          cp "$PREFIX/config.h" "$PREFIX/config_static.h" .
          mkdir -p include/memcached
          cp "$PREFIX"/include/arcus-memcached/*.h include/memcached/

      - run: cargo build

      - name: build-cluster
        timeout-minutes: 3
        env:
          ZK_CONTAINER: ${{ job.services.zookeeper.id }}
        run: |
          docker run --rm --network "container:$ZK_CONTAINER" \
            -e ZK_ENSEMBLE=localhost:2181 -e SERVICE_CODE=test -e IS_REPL=1 \
            -e CACHENODES=127.0.0.1:11211,127.0.0.1:11212 \
            jam2in/zkcli:3.5.9
          for port in 11211 11212; do
            "$PREFIX/bin/memcached" -E "$PREFIX/lib/default_engine.so" \
              -X "$GITHUB_WORKSPACE/target/debug/libarcusv.so" \
              -m 64 -z 127.0.0.1:2181 -d -p "$port"
            until printf 'ready\r\nquit\r\n' | nc 127.0.0.1 "$port" | grep -q '^READY'; do sleep 1; done
          done

      - run: cargo test
        env:
          ARCUS_VECTOR_MASTER: 127.0.0.1:11211
          ARCUS_VECTOR_SLAVE: 127.0.0.1:11212
