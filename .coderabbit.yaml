# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review settings for arcus-vector: vector search loaded into arcus-memcached as an
# ASCII protocol extension (`-X`). The module runs inside the daemon, so the review rules below
# are about keeping the daemon alive and the engine's memory sound.

language: "ko-KR"
tone_instructions: >-
  간결하게 지적하고, 문제가 되는 실행 경로나 입력을 근거로 든다. 취향 문제보다 데몬 중단, 메모리
  안전성, 동시성 결함을 먼저 본다.
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  # PRs target develop; the default branch (master) is reviewed without listing it.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"

  path_filters:
    - "!Cargo.lock"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Rust systems code. Beyond correctness, check:
        - Atomics: each `Ordering` must be justified by what it publishes or observes. Flag
          `Relaxed` on anything that guards other memory, and paired flag/count words that are
          read separately when they must be read together.
        - Locks: no lock held across a call into the engine, a callback, or another lock acquired
          in the opposite order elsewhere. Poisoned locks are recovered with
          `PoisonError::into_inner`, not unwrapped.
        - `unsafe impl Send/Sync` must say which fields are shared and what serializes them.
        - Errors are not silently dropped: a `let _ =` or ignored `Result` needs a reason visible
          in the code.
        - Prefer borrowing over cloning on hot paths (search, element events); flag needless
          `clone`/`to_vec`/`to_string` there.
    - path: "src/**/*.rs"
      instructions: |
        This crate is a cdylib that memcached loads into its own process. A panic or abort here
        takes the whole daemon down, so review for these rules:
        - Never abort on memory shortage. On request and callback paths, allocation must be
          fallible (`try_reserve` and similar) and failure must become `SERVER_ERROR`.
          Flag `Vec::push`/`collect`/`format!`/`to_owned`/`Box::new` on those paths unless the
          size is small and fixed.
        - No `unwrap`/`expect`/`panic!` outside tests.
        - Every `unsafe` block carries a `// SAFETY:` comment that states why it is sound at that
          site, and every `unsafe fn` documents its contract under `# Safety`. Check that the
          comment matches what the code actually relies on.
        - Log through the server's logger (`log_warn!`, `log_info!`, `log_debug!`, `log_detail!`),
          never `eprintln!`/`println!`. Building a log line must not allocate.
        - Lint exceptions use `#[expect(lint, reason = "...")]`, not `#[allow]`. Generated
          bindings (`src/memcached/ffi.rs`) are the exception: which lints fire there depends on
          the headers.
        - Element addresses are raw engine pointers. One reference per element of an event Map is
          ours; it must be released exactly once, and only after no search can still dereference
          it (retire barrier, or the index is halted).
    - path: "src/trigger/**/*.rs"
      instructions: |
        The item event callback runs under the engine's cache lock, on whatever thread linked the
        item (worker, replication apply, persistence recovery, collection delete). In it:
        - The only engine calls allowed are `get_item_info` and `get_elem_info`; anything else
          takes the cache lock again and deadlocks.
        - No graph (HNSW) work, no blocking, no allocation that can abort, and no dropping of the
          last reference to an index (its drop releases elements, which takes the cache lock).
        - The answer for every element of an event Map holds one reference
          (`target_ref`/`source_ref`); check that each path answers consistently with who
          releases the element later.
        - Graph work for one vkey is queued to the lane its hash selects, and must stay in event
          order.
    - path: "src/memcached/**/*.rs"
      instructions: |
        Wrappers over the memcached core API and the engine vtable, called by offset through
        bindgen bindings (`ffi`). The vtable layout comes from the server's `config.h`, not from a
        cargo feature. Check that pointers passed to C are valid for the duration the C side uses
        them.
    - path: "tests/**/*.rs"
      instructions: |
        Integration tests start a real arcus server and drive it over a socket. Each test owns its
        server; tests must not depend on order or shared state.
    - path: "build.rs"
      instructions: |
        Generates `engine_api.rs` in `OUT_DIR` with bindgen on every build, from `config.h`,
        `config_static.h` and `include/memcached/*.h` copied to the crate root from a configured
        arcus-memcached tree. These headers and the generated file are never committed. Check:
        - `-include config.h` stays, so the server's `ENABLE_*` flags decide the vtable layout.
        - Layout tests stay on: a member shifted by a header change must fail the build.
        - Missing headers fail with a message that says what to copy; errors are returned, not
          unwrapped.
    - path: "Cargo.toml"
      instructions: |
        Lints live in `[lints]`; weakening one needs a stated reason. A new dependency runs inside
        the daemon: check that it does not abort on allocation failure on our call paths, spawn
        threads before memcached daemonizes, or install global handlers (panic hooks, signals).
        Build dependencies (bindgen) do not run in the daemon.
    - path: ".github/workflows/**"
      instructions: |
        The `test` job reads the private arcus-memcached-EE repository with a GitHub App token.
        Check:
        - The token is created and used only in the steps that fetch EE, never in job-level `env`,
          and never printed, uploaded, or passed to other actions or build scripts.
        - The job stays behind the `ee` environment (approval) and is skipped for fork PRs.
        - `actions/checkout` in that job keeps `persist-credentials: false`.
        - Only first-party actions (`actions/*`) are used.

  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true
